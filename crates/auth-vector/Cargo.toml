[package]
name = "auth_vector"
version = "0.3.1"
edition = "2021"
description = "Contract kit for auth vectors: the produce/verify JSON shapes, the signed binding (service domain + action digest), and the scheme × authoriser composition shared by every service and vector module"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
sha2 = "0.10"

[lints]
workspace = true
