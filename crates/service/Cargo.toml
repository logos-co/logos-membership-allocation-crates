[package]
name = "paymaster_service"
version = "0.1.0"
edition = "2021"
description = "Provider-side engine for sponsored-action services: advertisement, the serialized request worker, the auth gate and the consumed-credential store"
license = "MIT OR Apache-2.0"

[dependencies]
paymaster_lp = { path = "../lp" }
paymaster_wire = { path = "../wire" }
auth_vector = { path = "../auth-vector" }
serde_json = "1"
hex = "0.4"

[dev-dependencies]
paymaster_lp = { path = "../lp", features = ["test-fake"] }
auth_vectors = { path = "../auth-vectors", default-features = false, features = ["verify"] }
base64 = "0.22"

[lints]
workspace = true
